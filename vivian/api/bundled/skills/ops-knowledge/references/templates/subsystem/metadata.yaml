# {SUBSYSTEM} 子系统元数据
# 定义本子系统的基本信息和所有实体

subsystem: "{subsystem}"
version: "YYYY-MM-DD"
description: ""
tier: "T1 | T2 | T3"
owner: ""
oncall: ""

# === 实体定义 ===
# ID 格式: {type}:{subsystem}:{name}
# type 枚举: app | db | cache | mq | host | service | config | lb | storage | network | platform | sop | script | incident

entities:
