app_name: "TCTP vivian API Server"

server:
  host: "0.0.0.0"
  port: 8081
  debug: true
  work_dir: "~/vivian_workspace"

auth:
  jwt_secret: "sk-vivian"
  jwt_expire_hours: 24
  default_password: "vivian"
  admins: [""]
  global_api_key: null
  enable_anonymous: false

logging:
  access:
    path: "logs/access.log"
    rotation_time: "00:00"
    rotation_size: "50 MB"
    retention: "7 days"
    format: >-
      {time:YYYY-MM-DD HH:mm:ss:SSS} | {level: <8} | {extra[client_ip]} | {extra[method]} | {extra[path]} | {extra[status_code]} | {extra[duration_ms]}ms | {extra[user_name]}
    level: "INFO"
    compression: "gz"
  server:
    path: "logs/server.log"
    rotation_time: "00:00"
    rotation_size: "50 MB"
    retention: "7 days"
    format: >-
      {time:YYYY-MM-DD HH:mm:ss:SSS} | {level: <8} | PID:{process} | {name}:{function}:{line} | {message}
    level: "DEBUG"
    compression: "gz"
  app:
    path: "logs/app.log"
    rotation_time: "00:00"
    rotation_size: "50 MB"
    retention: "30 days"
    format: >-
      {time:YYYY-MM-DD HH:mm:ss:SSS} | {message}
    level: "INFO"
    compression: "gz"
  scheduler:
    path: "logs/scheduler.log"
    rotation_time: "00:00"
    rotation_size: "50 MB"
    retention: "30 days"
    format: >-
      {time:YYYY-MM-DD HH:mm:ss:SSS} | {level: <8} | {name}:{function}:{line} | {message}
    level: "INFO"
    compression: "gz"

scheduler:
  shutdown_timeout: 60
  command_poll_interval: 1.0
  heartbeat_interval: 5.0

channels:
  command_poll_interval: 1.0
  heartbeat_interval: 5.0
  shutdown_timeout: 30
